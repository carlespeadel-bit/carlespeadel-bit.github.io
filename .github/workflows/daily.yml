name: precios-diarios
on:
  schedule: [{ cron: '10 6 * * *' }]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/fetch.mjs
      - run: node scripts/build.mjs
      - run: node scripts/snapshot.mjs
      - name: Publicar en Telegram
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/telegram.mjs
      - name: Guardar histórico
        run: |
          git config user.name "valorcarta-bot"
          git config user.email "bot@valorcarta.es"
          git add data/history data/changes.json data/cards.json data/sets.json
          git commit -m "precios $(date -u +%F)" || echo "sin cambios"
          git push
      - name: Desplegar
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=valorcarta
